services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codesazan}
      POSTGRES_USER: ${POSTGRES_USER:-codesazan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Host bind-mount: data survives container/Compose removal.
      - ${DATA_ROOT:-../codesazan-production-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [codesazan-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      # Host bind-mount: Redis persistence survives container/Compose removal.
      - ${DATA_ROOT:-../codesazan-production-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [codesazan-net]

  bootstrap:
    build: ./backend
    restart: "no"
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-codesazan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codesazan}
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      INFRA_REQUIRED: "true"
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      MEDIA_DIR: /app/media
      BOOTSTRAP_RETRIES: ${BOOTSTRAP_RETRIES:-90}
      BOOTSTRAP_DELAY_MS: ${BOOTSTRAP_DELAY_MS:-5000}
    command: ["node", "src/bootstrap.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT:-../codesazan-production-data}/media:/app/media
    networks: [codesazan-net]

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-codesazan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codesazan}
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      INFRA_REQUIRED: "true"
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      MEDIA_DIR: /app/media
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-524288000}
      IMAGE_MAX_UPLOAD_BYTES: ${IMAGE_MAX_UPLOAD_BYTES:-10485760}
      FILE_MAX_UPLOAD_BYTES: ${FILE_MAX_UPLOAD_BYTES:-26214400}
      INTEGRATION_CONFIG_KEY: ${INTEGRATION_CONFIG_KEY:?Set INTEGRATION_CONFIG_KEY in .env}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-35000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT: ${RATE_LIMIT:-240}
      JSON_LIMIT: ${JSON_LIMIT:-2mb}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      # Host bind-mount: uploaded videos/HLS survive container/Compose removal.
      - ${DATA_ROOT:-../codesazan-production-data}/media:/app/media
    networks: [codesazan-net]

  media-worker:
    build: ./worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-codesazan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codesazan}
      MEDIA_DIR: /app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      # Host bind-mount: uploaded videos/HLS survive container/Compose removal.
      - ${DATA_ROOT:-../codesazan-production-data}/media:/app/media
    networks: [codesazan-net]

  notification-worker:
    build: ./notification-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codesazan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codesazan}
      NOTIFY_DRIVER: ${NOTIFY_DRIVER:-console}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      INTEGRATION_CONFIG_KEY: ${INTEGRATION_CONFIG_KEY:?Set INTEGRATION_CONFIG_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    networks: [codesazan-net]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [codesazan-net]

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks: [codesazan-net]

networks:
  codesazan-net:
    driver: bridge

